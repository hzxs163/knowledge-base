name = "knowledge-base"
compatibility_date = "2024-12-18"

# ============================================================
# D1 数据库绑定
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "knowledge_db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# ============================================================
# 环境变量
# ============================================================
[vars]
JWT_SECRET = "your-jwt-secret-key-change-this-in-production"

# ============================================================
# Pages 部署配置
# ============================================================
[build]
command = ""

[build.upload]
format = "directory"

# ============================================================
# 生产环境
# ============================================================
[env.production]
vars = { JWT_SECRET = "production-jwt-secret-key" }

[env.production.d1_databases]
DB = "knowledge_db"

# ============================================================
# 预览环境
# ============================================================
[env.preview]
vars = { JWT_SECRET = "preview-jwt-secret-key" }

[env.preview.d1_databases]
DB = "knowledge_db"